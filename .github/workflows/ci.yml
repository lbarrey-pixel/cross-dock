name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sefaz-gw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crossdock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: crossdock
    steps:
      - uses: actions/checkout@v4
      - name: Stub do Supabase, migration e seed
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/stub_supabase.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Policies e RPCs por papel
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
